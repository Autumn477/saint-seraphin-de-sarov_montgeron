<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Préchargeur — 30 variantes</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#EFE9DF;--green:#2E5D4F;--gold:#C49A3A;--dark:#16261F;--muted:#6D5B4E;--e:cubic-bezier(.16,1,.3,1);}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:#1F1510;font-family:'DM Sans',sans-serif;padding:28px}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.5rem;margin:0 0 4px}
.lead{color:var(--muted);font-size:.82rem;margin:0 0 22px}
.bar{margin:0 0 20px}
button{font-family:'DM Sans',sans-serif;font-size:.72rem;letter-spacing:.05em;padding:.5rem 1rem;border:1px solid var(--green);
       background:var(--green);color:#fff;border-radius:8px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.cell{border:1px solid rgba(0,0,0,.09);border-radius:12px;overflow:hidden;background:#fff}
.stage{height:150px;display:flex;align-items:center;justify-content:center;background:#fff}
.stage.dark{background:var(--dark)}
.lab{font-size:.66rem;color:var(--muted);padding:8px 10px;border-top:1px solid rgba(0,0,0,.06);letter-spacing:.02em}

/* ====== TRACÉ (svg stroke) ====== */
.dr{width:140px;height:auto;overflow:visible}
.dr path{fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 3.4s var(--e) infinite both}
@keyframes draw{0%{stroke-dashoffset:1}50%{stroke-dashoffset:0}88%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
.dgreen path{stroke:var(--green)}
.dfast path{animation-duration:1.9s}
.dbounce path{animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
.drev path{animation-name:drawRev}
@keyframes drawRev{0%{stroke-dashoffset:-1}50%{stroke-dashoffset:0}88%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
.drf path{animation:draw 3.4s var(--e) infinite both, fillg 3.4s var(--e) infinite both}
@keyframes fillg{0%,46%{fill:transparent}72%,90%{fill:var(--green)}100%{fill:transparent}}
.dglow{filter:drop-shadow(0 0 4px var(--gold))}
.dglow path{animation-duration:3s}

/* ====== MASQUE (boîte masquée) ====== */
.mk{width:128px;height:114px;background:var(--green);
  -webkit-mask:url('assets/church-bold.svg') center/contain no-repeat;
          mask:url('assets/church-bold.svg') center/contain no-repeat}
.mk.gold{background:var(--gold)}

.wipeup{animation:wipeup 3s var(--e) infinite both}
@keyframes wipeup{0%{clip-path:inset(100% 0 0 0)}45%{clip-path:inset(0 0 0 0)}90%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(100% 0 0 0)}}
.wipedown{animation:wipedown 3s var(--e) infinite both}
@keyframes wipedown{0%{clip-path:inset(0 0 100% 0)}45%{clip-path:inset(0 0 0 0)}90%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 100% 0)}}
.wiperight{animation:wiperight 3s var(--e) infinite both}
@keyframes wiperight{0%{clip-path:inset(0 100% 0 0)}45%{clip-path:inset(0 0 0 0)}90%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
.iris{animation:iris 3s var(--e) infinite both}
@keyframes iris{0%{clip-path:circle(0% at 50% 55%)}50%{clip-path:circle(80% at 50% 55%)}90%{clip-path:circle(80% at 50% 55%)}100%{clip-path:circle(0% at 50% 55%)}}
.diag{animation:diag 3s var(--e) infinite both}
@keyframes diag{0%{clip-path:polygon(0 0,0 0,0 0,0 0)}50%{clip-path:polygon(0 0,160% 0,0 160%,0 0)}90%{clip-path:polygon(0 0,160% 0,0 160%,0 0)}100%{clip-path:polygon(0 0,0 0,0 0,0 0)}}
.liquid{animation:liquid 3.2s ease-in-out infinite both}
@keyframes liquid{0%{clip-path:inset(100% 0 0 0)}55%{clip-path:inset(0 0 0 0)}92%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(100% 0 0 0)}}

.fz{animation:fz 2.8s var(--e) infinite both}
@keyframes fz{0%{opacity:0;transform:scale(.6)}45%{opacity:1;transform:scale(1)}88%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.6)}}
.spring{animation:spring 2.8s infinite both;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@keyframes spring{0%{opacity:0;transform:scale(0)}45%{opacity:1;transform:scale(1)}88%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(0)}}
.rise{animation:rise 2.8s var(--e) infinite both}
@keyframes rise{0%{opacity:0;transform:translateY(26px)}45%{opacity:1;transform:translateY(0)}88%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(26px)}}
.rot{animation:rot 2.8s var(--e) infinite both}
@keyframes rot{0%{opacity:0;transform:rotate(-16deg) scale(.7)}45%{opacity:1;transform:rotate(0) scale(1)}88%{opacity:1;transform:none}100%{opacity:0;transform:rotate(-16deg) scale(.7)}}
.flipv{animation:flipv 2.8s var(--e) infinite both}
@keyframes flipv{0%{opacity:0;transform:perspective(420px) rotateX(90deg)}45%{opacity:1;transform:perspective(420px) rotateX(0)}88%{opacity:1}100%{opacity:0;transform:perspective(420px) rotateX(90deg)}}
.fliph{animation:fliph 2.8s var(--e) infinite both}
@keyframes fliph{0%{opacity:0;transform:perspective(420px) rotateY(90deg)}45%{opacity:1;transform:perspective(420px) rotateY(0)}88%{opacity:1}100%{opacity:0;transform:perspective(420px) rotateY(90deg)}}
.tilt{animation:tilt 3s var(--e) infinite both}
@keyframes tilt{0%{opacity:0;transform:perspective(500px) rotateX(40deg) translateY(20px)}45%{opacity:1;transform:none}88%{opacity:1}100%{opacity:0;transform:perspective(500px) rotateX(40deg) translateY(20px)}}
.swing{transform-origin:50% 0;animation:swing 3s ease-in-out infinite both}
@keyframes swing{0%{opacity:0;transform:rotate(-12deg)}30%{opacity:1;transform:rotate(8deg)}50%{transform:rotate(-4deg)}68%{transform:rotate(0)}88%{opacity:1;transform:none}100%{opacity:0;transform:rotate(-12deg)}}
.zoomrot{animation:zoomrot 3s var(--e) infinite both}
@keyframes zoomrot{0%{opacity:0;transform:scale(.3) rotate(-40deg)}45%{opacity:1;transform:scale(1) rotate(0)}88%{opacity:1}100%{opacity:0;transform:scale(.3) rotate(-40deg)}}

.sweep{background:linear-gradient(100deg,var(--green) 0 38%,var(--gold) 50%,var(--green) 62% 100%);background-size:300% 100%;animation:sweep 2.4s linear infinite}
@keyframes sweep{0%{background-position:130% 0}100%{background-position:-30% 0}}
.grad{background:linear-gradient(90deg,var(--green),var(--gold),var(--green));background-size:200% 100%;animation:grad 3s ease-in-out infinite alternate}
@keyframes grad{0%{background-position:0 0}100%{background-position:100% 0}}
.breathe{animation:breathe 2.4s ease-in-out infinite both}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1)}}
.shimmer{background:linear-gradient(105deg,var(--gold) 0 40%,#F2E2B0 50%,var(--gold) 60% 100%);background-size:300% 100%;animation:sweep 2.2s linear infinite}
.halo{animation:halo 2.2s ease-in-out infinite both}
@keyframes halo{0%,100%{filter:drop-shadow(0 0 1px rgba(196,154,58,.25))}50%{filter:drop-shadow(0 0 10px rgba(196,154,58,.8))}}
.defocus{animation:defocus 2.8s ease infinite both}
@keyframes defocus{0%{filter:blur(7px);opacity:0}45%{filter:blur(0);opacity:1}88%{filter:blur(0);opacity:1}100%{filter:blur(7px);opacity:0}}
.heart{animation:heart 2.4s ease-in-out infinite both}
@keyframes heart{0%{transform:scale(.8);opacity:.4}20%{transform:scale(1.08)}35%{transform:scale(.95)}50%{transform:scale(1.03);opacity:1}70%{transform:scale(1)}100%{transform:scale(.8);opacity:.4}}
</style>
</head>
<body>
<h1>Préchargeur — 30 variantes d'animation</h1>
<p class="lead">Chaque vignette rejoue en boucle l'animation d'apparition de votre logo. Dis-moi le ou les numéros qui te plaisent.</p>
<div class="bar"><button onclick="location.reload()">↻ Rejouer toutes</button></div>
<div class="grid" id="grid"></div>

<script>
var V = [
  {n:1, type:'draw', cls:'', seq:true, label:'Tracé séquentiel'},
  {n:2, type:'draw', cls:'', label:'Tracé simultané'},
  {n:3, type:'draw', cls:'drf', label:'Tracé puis remplissage'},
  {n:4, type:'draw', cls:'drev', label:'Tracé inversé'},
  {n:5, type:'draw', cls:'dbounce', label:'Tracé rebond'},
  {n:6, type:'draw', cls:'dglow', dark:true, label:'Tracé néon (lueur)'},
  {n:7, type:'draw', cls:'dgreen', label:'Tracé vert'},
  {n:8, type:'draw', cls:'dfast', label:'Tracé rapide'},
  {n:9, type:'mask', cls:'wipeup', label:'Révélation bas → haut'},
  {n:10, type:'mask', cls:'wipedown', label:'Révélation haut → bas'},
  {n:11, type:'mask', cls:'wiperight', label:'Révélation gauche → droite'},
  {n:12, type:'mask', cls:'iris', label:'Révélation radiale'},
  {n:13, type:'mask', cls:'diag', label:'Volet diagonal'},
  {n:14, type:'mask', cls:'liquid', label:'Remplissage liquide'},
  {n:15, type:'mask', cls:'fz', label:'Fondu + zoom'},
  {n:16, type:'mask', cls:'spring', label:'Zoom ressort'},
  {n:17, type:'mask', cls:'rise', label:'Fondu + montée'},
  {n:18, type:'mask', cls:'rot', label:'Rotation + fondu'},
  {n:19, type:'mask', cls:'flipv', label:'Flip vertical 3D'},
  {n:20, type:'mask', cls:'fliph', label:'Flip horizontal 3D'},
  {n:21, type:'mask', cls:'tilt', label:'Bascule perspective'},
  {n:22, type:'mask', cls:'swing', label:'Balancier'},
  {n:23, type:'mask', cls:'zoomrot', label:'Zoom tournant'},
  {n:24, type:'mask', cls:'sweep', dark:true, label:'Balayage doré'},
  {n:25, type:'mask', cls:'grad', label:'Dégradé vert → or'},
  {n:26, type:'mask', cls:'breathe', label:'Pulsation (respire)'},
  {n:27, type:'mask', cls:'shimmer', dark:true, label:'Scintillement'},
  {n:28, type:'mask', cls:'halo gold', dark:true, label:'Halo pulsé'},
  {n:29, type:'mask', cls:'defocus', label:'Flou → net'},
  {n:30, type:'mask', cls:'heart', label:'Battement'}
];
fetch('assets/church-silhouette.svg').then(function(r){return r.text();}).then(function(svgTxt){
  var grid = document.getElementById('grid');
  V.forEach(function(v){
    var cell=document.createElement('div'); cell.className='cell';
    var stage=document.createElement('div'); stage.className='stage'+(v.dark?' dark':'');
    if(v.type==='draw'){
      stage.innerHTML=svgTxt;
      var svg=stage.querySelector('svg'); svg.removeAttribute('width'); svg.removeAttribute('height');
      svg.classList.add('dr'); v.cls.split(' ').forEach(function(c){if(c)svg.classList.add(c);});
      svg.querySelectorAll('path').forEach(function(p,i){
        p.setAttribute('pathLength','1');
        if(v.seq) p.style.animationDelay=(i*0.1)+'s';
      });
    } else {
      var b=document.createElement('div'); b.className='mk '+v.cls; stage.appendChild(b);
    }
    cell.appendChild(stage);
    var lab=document.createElement('div'); lab.className='lab'; lab.textContent=v.n+' · '+v.label;
    cell.appendChild(lab);
    grid.appendChild(cell);
  });
});
</script>
</body>
</html>
