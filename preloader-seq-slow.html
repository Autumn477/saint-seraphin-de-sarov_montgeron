<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracé séquentiel — variantes lentes</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#EFE9DF;--green:#2E5D4F;--gold:#C49A3A;--dark:#16261F;--muted:#6D5B4E;}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:#1F1510;font-family:'DM Sans',sans-serif;padding:28px}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.5rem;margin:0 0 4px}
.lead{color:var(--muted);font-size:.82rem;margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.cell{border:1px solid rgba(0,0,0,.09);border-radius:12px;overflow:hidden;background:#fff}
.stage{height:180px;display:flex;align-items:center;justify-content:center;background:#fff}
.stage svg{width:160px;height:auto;overflow:visible}
.stage svg path{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;}
.lab{font-size:.72rem;color:#1F1510;padding:9px 11px 4px;font-weight:500}
.sub{font-size:.64rem;color:var(--muted);padding:0 11px 9px}
</style>
</head>
<body>
<h1>Tracé séquentiel — versions plus lentes</h1>
<p class="lead">Le logo se dessine trait par trait. 8 cadences, de la plus douce à l'ultra-lente. Le numéro + la cadence exacte sont indiqués. Dis-moi le numéro choisi.</p>
<div class="grid" id="grid"></div>

<script>
// D = duree de trace par trait (s) ; S = decalage entre traits (s)
var V = [
  {n:1, label:'Lent doux',        D:1.6, S:0.18, ease:'cubic-bezier(.16,1,.3,1)', color:'#C49A3A'},
  {n:2, label:'Lent régulier',    D:1.5, S:0.25, ease:'linear',                    color:'#C49A3A'},
  {n:3, label:'Très lent',        D:2.2, S:0.30, ease:'cubic-bezier(.16,1,.3,1)', color:'#C49A3A'},
  {n:4, label:'Cinématique',      D:2.6, S:0.42, ease:'ease-in-out',               color:'#C49A3A'},
  {n:5, label:'Lent + remplissage',D:1.7,S:0.20, ease:'cubic-bezier(.16,1,.3,1)', color:'#C49A3A', fill:'#2E5D4F'},
  {n:6, label:'Lent vert',        D:1.9, S:0.24, ease:'cubic-bezier(.16,1,.3,1)', color:'#2E5D4F'},
  {n:7, label:'Lent rebond',      D:1.8, S:0.22, ease:'cubic-bezier(.34,1.56,.64,1)', color:'#C49A3A'},
  {n:8, label:'Ultra lent',       D:3.0, S:0.50, ease:'cubic-bezier(.16,1,.3,1)', color:'#C49A3A'}
];
var PAUSE = 1.0; // pause avant de rejouer (s)

fetch('assets/church-silhouette.svg').then(function(r){return r.text();}).then(function(svgTxt){
  var grid=document.getElementById('grid');
  V.forEach(function(v){
    var cell=document.createElement('div'); cell.className='cell';
    var stage=document.createElement('div'); stage.className='stage';
    stage.innerHTML=svgTxt;
    var svg=stage.querySelector('svg'); svg.removeAttribute('width'); svg.removeAttribute('height');
    var paths=svg.querySelectorAll('path');
    paths.forEach(function(p){ p.setAttribute('pathLength','1'); p.style.stroke=v.color; });
    cell.appendChild(stage);
    var lab=document.createElement('div'); lab.className='lab'; lab.textContent=v.n+' · '+v.label;
    var n=paths.length, total=(v.D + (n-1)*v.S);
    var sub=document.createElement('div'); sub.className='sub';
    sub.textContent='trait '+v.D+'s · décalage '+v.S+'s · ~'+total.toFixed(1)+'s au total';
    cell.appendChild(lab); cell.appendChild(sub);
    grid.appendChild(cell);

    function cycle(){
      paths.forEach(function(p){ p.style.transition='none'; p.style.strokeDasharray='1'; p.style.strokeDashoffset='1'; p.style.fill='none'; });
      svg.getBoundingClientRect(); // reflow
      requestAnimationFrame(function(){
        paths.forEach(function(p,i){
          p.style.transition='stroke-dashoffset '+v.D+'s '+v.ease+' '+(i*v.S)+'s';
          p.style.strokeDashoffset='0';
        });
        if(v.fill){
          paths.forEach(function(p,i){
            p.style.transition+=' , fill .7s ease '+(total*1000>0?(i*v.S+v.D*0.6):0)+'s';
            setTimeout(function(){ p.style.fill=v.fill; }, (i*v.S+v.D*0.55)*1000);
          });
        }
      });
      setTimeout(cycle, (total+PAUSE)*1000);
    }
    cycle();
  });
});
</script>
</body>
</html>
